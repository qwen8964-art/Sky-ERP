name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: skyerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          npm ci
          cd apps/api && npm ci
          cd ../web && npm ci

      - name: Generate Prisma Client
        run: |
          cd apps/api
          npx prisma generate
          npx prisma db push --force-reset

      - name: Run API Tests
        run: |
          cd apps/api
          npm run test
        env:
          DATABASE_URL: postgresql://test:testpassword@localhost:5432/skyerp_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test

      - name: Run Web Tests
        run: |
          cd apps/web
          npm run test
        env:
          VITE_API_URL: http://localhost:3001
          NODE_ENV: test

      - name: Build applications
        run: |
          cd apps/api
          npm run build
          cd ../web
          npm run build

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            apps/api/test-results.xml
            apps/web/test-results.xml

  e2e:
    runs-on: ubuntu-latest
    needs: test
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: skyerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          npm ci
          cd apps/api && npm ci
          cd ../web && npm ci

      - name: Install Playwright browsers
        run: |
          cd apps/web
          npx playwright install --with-deps

      - name: Generate Prisma Client and Seed DB
        run: |
          cd apps/api
          npx prisma generate
          npx prisma db push --force-reset
          npm run seed

      - name: Start API server
        run: |
          cd apps/api
          npm run dev &
          sleep 5
        env:
          DATABASE_URL: postgresql://test:testpassword@localhost:5432/skyerp_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test
          PORT: 3001

      - name: Start Web server
        run: |
          cd apps/web
          npm run preview &
          sleep 5
        env:
          VITE_API_URL: http://localhost:3001
          NODE_ENV: test

      - name: Run E2E tests
        run: |
          cd apps/web
          npm run test:e2e

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            apps/web/playwright-report/**
            apps/web/test-results/**

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sky-erp-api:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sky-erp-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sky-erp-api:buildcache,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sky-erp-web:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sky-erp-web:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/sky-erp-web:buildcache,mode=max
