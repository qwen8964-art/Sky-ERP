version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: skynet-erp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skynet_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skynet-network

  # API Backend (Development)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: skynet-erp-api-dev
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/skynet_erp
      JWT_SECRET: ${JWT_SECRET:-skynet-erp-secret-key-change-in-production}
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./prisma:/app/prisma
      - /app/node_modules
    working_dir: /app/apps/api
    command: npm run dev
    networks:
      - skynet-network

  # Frontend Web (Development)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    container_name: skynet-erp-web-dev
    environment:
      VITE_API_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
    working_dir: /app/apps/web
    command: npm run dev
    networks:
      - skynet-network

  # API Backend (Production)
  api-prod:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: skynet-erp-api-prod
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/skynet_erp
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - skynet-network
    profiles:
      - production

  # Frontend Web (Production)
  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    container_name: skynet-erp-web-prod
    environment:
      VITE_API_URL: http://api-prod:3001
      NODE_ENV: production
    ports:
      - "80:80"
    depends_on:
      - api-prod
    restart: unless-stopped
    networks:
      - skynet-network
    profiles:
      - production

volumes:
  postgres_data:

networks:
  skynet-network:
    driver: bridge
